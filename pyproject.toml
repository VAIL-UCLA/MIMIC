[project]
name = "mimic"
version = "0.1.0"
description = "MIMIC: data augmentation for sidewalk navigation policy learning"
readme = "README.md"
authors = [
    { name = "DhlinV", email = "hollis71025@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
# Runtime for scripts/visualize_augmentation.py. No GPU and no models: it reads
# the clips and the labels, so the trajectory comparison works before either
# augmentation stage has been run.
viz = [
    "opencv-python",
]
# Runtime for mimic.action_augmentation (TrajectoryCrafter). Needs a CUDA GPU.
# The label path (--labels_only) needs none of this, only numpy.
action = [
    "torch",
    "torchvision",
    # Upper bounds are load-bearing, not caution. diffusers >= 0.40 requires
    # huggingface-hub >= 1.0 while transformers < 5 requires < 1.0, so the two
    # cannot both float. transformers 5.x also reads the refinement model's
    # SentencePiece tokenizer with the wrong loader. Upstream pins
    # transformers==4.47; Light-A-Video pins 4.48 and needs diffusers >= 0.33
    # for the Wan backbone, so this window is the overlap that serves both.
    "diffusers>=0.33,<0.40",
    "transformers>=4.47,<5",
    "accelerate",
    "safetensors",
    "einops",
    "opencv-python",
    "imageio[ffmpeg]",
    "pillow",
    "omegaconf",
    "scikit-image",
    "decord",
    "kornia",
    "sentencepiece",
    # transformers converts the refinement model's SentencePiece tokenizer
    # through protobuf; without it the tokenizer cannot be built.
    "protobuf",
    "huggingface-hub<1.0",
    "ftfy",
]
# Runtime for mimic.appearance_augmentation (Light-A-Video). Needs a CUDA GPU.
# Versions follow Light-A-Video's requirements.txt; diffusers must be new enough
# for the Wan2.1 backbone (AutoencoderKLWan).
appearance = [
    "torch",
    "torchvision",
    # AutoencoderKLWan (the Wan2.1 backbone) needs diffusers >= 0.33, and the
    # same huggingface-hub coupling as the action extra caps it below 0.40.
    "diffusers>=0.33,<0.40",
    "transformers>=4.48,<5",
    "huggingface-hub<1.0",
    "accelerate",
    "safetensors",
    "peft",
    "einops",
    "opencv-python",
    "imageio[ffmpeg]",
    "pillow",
    "omegaconf",
    "ultralytics",
    # Light-A-Video reads clips through moviepy.editor, which 2.x removed.
    # Upstream pins 1.0.3.
    "moviepy>=1.0,<2",
    "ftfy",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Upstream code, vendored as a submodule and used unmodified.
extend-exclude = [
    "mimic/appearance_augmentation/third_party",
    "mimic/action_augmentation/third_party",
]
