[project]
name = "mimic"
version = "0.1.0"
description = "MIMIC: data augmentation for sidewalk navigation policy learning"
readme = "README.md"
authors = [
    { name = "DhlinV", email = "hollis71025@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
# Runtime for mimic.action_augmentation (TrajectoryCrafter). Needs a CUDA GPU.
# The label path (--labels_only) needs none of this, only numpy.
action = [
    "torch",
    "torchvision",
    "diffusers>=0.30.1",
    "transformers",
    "accelerate",
    "safetensors",
    "einops",
    "opencv-python",
    "imageio[ffmpeg]",
    "pillow",
    "omegaconf",
    "scikit-image",
    "decord",
    "kornia",
    "sentencepiece",
    "ftfy",
]
# Runtime for mimic.appearance_augmentation (Light-A-Video). Needs a CUDA GPU.
# Versions follow Light-A-Video's requirements.txt; diffusers must be new enough
# for the Wan2.1 backbone (AutoencoderKLWan).
appearance = [
    "torch",
    "torchvision",
    "diffusers>=0.33",
    "transformers",
    "accelerate",
    "safetensors",
    "peft",
    "einops",
    "opencv-python",
    "imageio[ffmpeg]",
    "pillow",
    "omegaconf",
    "ultralytics",
    "ftfy",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Upstream code, vendored as a submodule and used unmodified.
extend-exclude = [
    "mimic/appearance_augmentation/third_party",
    "mimic/action_augmentation/third_party",
]
